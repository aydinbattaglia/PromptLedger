<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PromptLedger — Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Theme variables ── */
    :root {
      --bg:           #f4f4f8;
      --surface:      #ffffff;
      --raised:       #ebebf2;
      --border:       #dcdce8;
      --border-sub:   #e8e8f2;
      --text:         #1c1c2e;
      --text-2:       #4c4c68;
      --text-3:       #808098;
      --text-4:       #686888;
      --white:        #1c1c2e;
      --accent:       #4f4fd4;
      --cost:         #1a8a3a;
      --flag:         #b84800;
      --danger:       #cc2020;
      --btn-border:   #c4c4d8;
      --btn-active-bg:     #dcdcec;
      --btn-active-border: #a8a8c8;
      --input-bg:     #ebebf2;
    }

    :root[data-theme="dark"] {
      --bg:           #0f0f11;
      --surface:      #141418;
      --raised:       #1a1a22;
      --border:       #1e1e24;
      --border-sub:   #1a1a20;
      --text:         #e2e2e8;
      --text-2:       #b0b0c0;
      --text-3:       #686878;
      --text-4:       #9898a8;
      --white:        #ffffff;
      --accent:       #7c7cff;
      --cost:         #7cff9e;
      --flag:         #ff8c55;
      --danger:       #ff5555;
      --btn-border:   #2e2e38;
      --btn-active-bg:     #2e2e38;
      --btn-active-border: #3e3e50;
      --input-bg:     #1a1a22;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.15s, color 0.15s;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 10;
      transition: background 0.15s, border-color 0.15s;
    }

    h1 {
      font-size: 15px;
      font-weight: 600;
      color: var(--white);
      letter-spacing: -0.01em;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 5px;
      border: 1px solid var(--btn-border);
      background: transparent;
      color: var(--text-4);
      cursor: pointer;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
    }
    .btn:hover { background: var(--raised); color: var(--text); }

    .btn-primary { border-color: var(--accent); color: var(--accent); }
    .btn-primary:hover { background: var(--accent); color: #fff; }

    .btn-danger { border-color: var(--danger); color: var(--danger); }
    .btn-danger:hover { background: var(--danger); color: #fff; }

    /* ── Main layout ── */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }

    /* ── Filter bar ── */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
      align-items: flex-end;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .filter-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-3);
    }

    select, input[type="date"], input[type="text"] {
      background: var(--input-bg);
      border: 1px solid var(--btn-border);
      border-radius: 5px;
      color: var(--text);
      font-size: 12px;
      padding: 6px 10px;
      outline: none;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    select:focus, input:focus { border-color: var(--accent); }

    select { min-width: 120px; }
    input[type="date"] { width: 140px; }
    input[type="text"] { width: 200px; }

    .filter-actions {
      display: flex;
      gap: 6px;
      align-items: flex-end;
    }

    /* ── Summary cards ── */
    .summary-cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: var(--border);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .card {
      background: var(--bg);
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      transition: background 0.15s;
    }

    .card-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-3);
    }

    .card-value {
      font-size: 22px;
      font-weight: 600;
      color: var(--white);
      font-variant-numeric: tabular-nums;
    }

    .card-value.flagged { color: var(--flag); }

    /* ── Charts row ── */
    .charts-row {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 16px;
      margin-bottom: 20px;
    }

    .chart-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      transition: background 0.15s, border-color 0.15s;
    }

    .chart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .chart-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-3);
    }

    .range-toggle {
      display: flex;
      gap: 2px;
    }

    .range-btn {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 3px;
      border: 1px solid var(--btn-border);
      background: transparent;
      color: var(--text-3);
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
    }
    .range-btn.active {
      background: var(--btn-active-bg);
      color: var(--text);
      border-color: var(--btn-active-border);
    }

    .chart-canvas-wrap { position: relative; height: 180px; }

    /* ── Table section ── */
    .table-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      transition: background 0.15s, border-color 0.15s;
    }

    .table-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }

    .table-header .chart-title { margin: 0; }

    .record-count {
      font-size: 11px;
      color: var(--text-3);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead th {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-3);
      text-align: left;
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      font-weight: 500;
      white-space: nowrap;
    }

    tbody tr {
      border-bottom: 1px solid var(--border-sub);
      transition: background 0.1s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--raised); }
    tbody tr.flagged-row td:first-child { border-left: 2px solid var(--flag); }

    tbody td {
      padding: 9px 16px;
      color: var(--text-2);
      font-size: 12px;
      vertical-align: middle;
    }

    td.ts { color: var(--text-3); font-size: 11px; white-space: nowrap; }
    td.tool { text-transform: capitalize; color: var(--text); }
    td.model { font-size: 11px; max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    td.prompt-cell { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-4); }
    td.num { font-variant-numeric: tabular-nums; text-align: right; color: var(--text); }
    td.cost { font-variant-numeric: tabular-nums; text-align: right; color: var(--cost); }
    td.actions { text-align: right; white-space: nowrap; }

    td.proj-cell { max-width: 120px; }

    .proj-select {
      font-size: 11px;
      padding: 2px 4px;
      border-radius: 3px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-2);
      outline: none;
      cursor: pointer;
      max-width: 115px;
      width: 100%;
    }
    .proj-select:hover { border-color: var(--border); background: var(--raised); }
    .proj-select:focus { border-color: var(--accent); background: var(--raised); }

    .del-btn {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 3px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-3);
      cursor: pointer;
      transition: border-color 0.1s, color 0.1s;
    }
    .del-btn:hover { border-color: var(--danger); color: var(--danger); }

    .proj-badge {
      display: inline-block;
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 3px;
      background: rgba(79,79,212,0.1);
      color: var(--accent);
      margin-left: 4px;
      vertical-align: middle;
      letter-spacing: 0;
      text-transform: none;
      font-weight: normal;
    }

    .flag-badge {
      display: inline-block;
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 3px;
      background: rgba(255, 140, 85, 0.15);
      color: var(--flag);
      margin-left: 4px;
      vertical-align: middle;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* ── Pagination ── */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
    }

    .page-btn {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid var(--btn-border);
      background: transparent;
      color: var(--text-3);
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
    }
    .page-btn:hover:not(:disabled) { background: var(--raised); color: var(--text); }
    .page-btn:disabled { opacity: 0.3; cursor: default; }
    .page-btn.active { background: var(--btn-active-bg); color: var(--text); border-color: var(--btn-active-border); }

    /* ── Empty / loading states ── */
    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-3);
    }
    .empty-state p { line-height: 1.8; }

    .loading {
      text-align: center;
      padding: 32px;
      color: var(--text-3);
    }
  </style>
</head>
<body>
  <header>
    <h1>PromptLedger</h1>
    <div class="header-actions">
      <button class="btn" id="theme-btn">Dark mode</button>
      <button class="btn btn-primary" id="export-btn">Export CSV</button>
      <button class="btn btn-danger" id="clear-btn">Clear all</button>
    </div>
  </header>

  <main>
    <!-- Filter bar -->
    <div class="filter-bar">
      <div class="filter-group">
        <span class="filter-label">Tool</span>
        <select id="filter-tool">
          <option value="">All tools</option>
          <option value="runway">Runway</option>
          <option value="midjourney">Midjourney</option>
          <option value="elevenlabs">ElevenLabs</option>
        </select>
      </div>
      <div class="filter-group">
        <span class="filter-label">Project</span>
        <select id="filter-project">
          <option value="">All projects</option>
        </select>
      </div>
      <div class="filter-group">
        <span class="filter-label">From</span>
        <input type="date" id="filter-from" />
      </div>
      <div class="filter-group">
        <span class="filter-label">To</span>
        <input type="date" id="filter-to" />
      </div>
      <div class="filter-group">
        <span class="filter-label">Search</span>
        <input type="text" id="filter-search" placeholder="Filter by prompt…" />
      </div>
      <div class="filter-actions">
        <button class="btn" id="filter-apply">Apply</button>
        <button class="btn" id="filter-clear">Clear</button>
      </div>
    </div>

    <!-- Summary cards -->
    <div class="summary-cards">
      <div class="card">
        <span class="card-label">Total cost</span>
        <span class="card-value" id="sum-cost">—</span>
      </div>
      <div class="card">
        <span class="card-label">Total credits</span>
        <span class="card-value" id="sum-credits">—</span>
      </div>
      <div class="card">
        <span class="card-label">Generations</span>
        <span class="card-value" id="sum-count">—</span>
      </div>
      <div class="card">
        <span class="card-label">Flagged</span>
        <span class="card-value flagged" id="sum-flagged">—</span>
      </div>
    </div>

    <!-- Charts -->
    <div class="charts-row">
      <div class="chart-box">
        <div class="chart-header">
          <span class="chart-title">Daily spend</span>
          <div class="range-toggle">
            <button class="range-btn active" data-days="30">30d</button>
            <button class="range-btn" data-days="90">90d</button>
          </div>
        </div>
        <div class="chart-canvas-wrap">
          <canvas id="timeseries-chart"></canvas>
        </div>
      </div>
      <div class="chart-box">
        <div class="chart-header">
          <span class="chart-title">By tool</span>
        </div>
        <div class="chart-canvas-wrap">
          <canvas id="donut-chart"></canvas>
        </div>
      </div>
    </div>

    <!-- Log table -->
    <div class="table-section">
      <div class="table-header">
        <span class="chart-title">Generations</span>
        <span class="record-count" id="record-count"></span>
      </div>
      <div id="table-wrap">
        <div class="loading">Loading…</div>
      </div>
      <div class="pagination" id="pagination" style="display:none"></div>
    </div>
  </main>

  <script src="dashboard.js"></script>
</body>
</html>
