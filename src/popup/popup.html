<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PromptLedger</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #f4f4f8;
      --surface:    #ffffff;
      --raised:     #ebebf2;
      --border:     #dcdce8;
      --border-sub: #e8e8f2;
      --text:       #1c1c2e;
      --text-2:     #4c4c68;
      --text-3:     #808098;
      --text-4:     #686888;
      --white:      #1c1c2e;
      --accent:     #4f4fd4;
      --btn-border: #c4c4d8;
      --input-bg:   #ebebf2;
    }
    :root[data-theme="dark"] {
      --bg:         #0f0f11;
      --surface:    #141418;
      --raised:     #1a1a22;
      --border:     #1e1e24;
      --border-sub: #1a1a20;
      --text:       #e2e2e8;
      --text-2:     #b0b0c0;
      --text-3:     #686878;
      --text-4:     #9898a8;
      --white:      #ffffff;
      --accent:     #7c7cff;
      --btn-border: #2e2e38;
      --input-bg:   #1a1a22;
    }

    body {
      width: 320px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--white);
    }

    #pause-btn {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 4px;
      border: 1px solid var(--btn-border);
      background: transparent;
      color: var(--text-4);
      cursor: pointer;
    }
    #pause-btn:hover { background: var(--raised); color: var(--text); }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1px;
      background: var(--border);
      border-bottom: 1px solid var(--border);
    }

    .stat {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 16px 14px;
      background: var(--bg);
    }

    .stat .label {
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-3);
    }

    .stat .value {
      font-size: 20px;
      font-weight: 700;
      color: var(--white);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }

    #by-tool {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }

    .tool-row {
      display: flex;
      flex-direction: column;
      padding: 7px 0;
      border-bottom: 1px solid var(--border-sub);
      color: var(--text-2);
    }
    .tool-row:last-child { border-bottom: none; }

    .tool-row-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
    }

    .tool-name { font-size: 12px; }
    .tool-cost { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--text); }

    .tool-bar-track {
      height: 2px;
      background: var(--border);
      border-radius: 2px;
    }
    .tool-bar-fill {
      height: 2px;
      background: var(--accent);
      border-radius: 2px;
      opacity: 0.6;
      transition: width 0.35s ease;
    }

    .empty-state {
      padding: 20px 16px;
      text-align: center;
      color: var(--text-3);
      font-size: 12px;
      line-height: 1.6;
    }

    /* ── Projects section ── */
    #projects {
      padding: 10px 16px 14px;
      border-bottom: 1px solid var(--border);
    }

    .project-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    #project-select {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid var(--btn-border);
      border-radius: 4px;
      color: var(--text);
      font-size: 12px;
      padding: 4px 8px;
      outline: none;
    }
    #project-select:focus { border-color: var(--accent); }

    #new-proj-btn {
      font-size: 15px;
      line-height: 1;
      width: 24px;
      height: 24px;
      border-radius: 4px;
      border: 1px solid var(--btn-border);
      background: transparent;
      color: var(--text-4);
      cursor: pointer;
    }
    #new-proj-btn:hover { background: var(--raised); color: var(--text); }

    .project-form {
      display: none;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
    }
    .project-form.visible { display: flex; }

    .proj-input {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid var(--btn-border);
      border-radius: 4px;
      color: var(--text);
      font-size: 12px;
      padding: 4px 8px;
      outline: none;
    }
    .proj-input:focus { border-color: var(--accent); }

    .proj-save {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--accent);
      cursor: pointer;
    }
    .proj-save:hover { background: var(--accent); color: var(--surface); }

    .proj-cancel {
      font-size: 11px;
      background: none;
      border: none;
      color: var(--text-3);
      cursor: pointer;
      padding: 0 2px;
    }
    .proj-cancel:hover { color: var(--text); }

    /* ── Plans section ── */
    #plans {
      padding: 10px 16px 14px;
      border-bottom: 1px solid var(--border);
    }

    .section-label {
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-3);
      margin-bottom: 8px;
    }

    .plan-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 0;
      border-bottom: 1px solid var(--border-sub);
    }
    .plan-row:last-child { border-bottom: none; }

    .plan-tool {
      text-transform: capitalize;
      color: var(--text-2);
      width: 76px;
      flex-shrink: 0;
    }

    .plan-select {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid var(--btn-border);
      border-radius: 4px;
      color: var(--text);
      font-size: 11px;
      padding: 3px 6px;
      outline: none;
      cursor: pointer;
      min-width: 0;
    }
    .plan-select:focus { border-color: var(--accent); }

    /* ── Budget section ── */
    #budgets {
      padding: 10px 16px 14px;
      border-bottom: 1px solid var(--border);
    }

    .budget-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 0;
      border-bottom: 1px solid var(--border-sub);
    }
    .budget-row:last-child { border-bottom: none; }

    .budget-tool {
      text-transform: capitalize;
      color: var(--text-2);
      width: 76px;
      flex-shrink: 0;
    }

    .budget-limits {
      flex: 1;
      font-size: 12px;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
    }
    .budget-limits span { color: var(--text); }

    .budget-edit {
      font-size: 11px;
      color: var(--accent);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      white-space: nowrap;
    }
    .budget-edit:hover { text-decoration: underline; }

    .budget-form {
      display: none;
      flex-direction: column;
      gap: 6px;
      padding: 6px 0;
      border-bottom: 1px solid var(--border-sub);
    }
    .budget-form:last-child { border-bottom: none; }
    .budget-form.visible { display: flex; }

    .budget-form-tool {
      font-size: 12px;
      text-transform: capitalize;
      color: var(--text-2);
      font-weight: 600;
    }

    .budget-input-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .budget-label {
      font-size: 11px;
      color: var(--text-3);
      width: 46px;
      flex-shrink: 0;
    }

    .budget-prefix {
      font-size: 12px;
      color: var(--text-3);
    }

    .budget-input {
      width: 64px;
      background: var(--input-bg);
      border: 1px solid var(--btn-border);
      border-radius: 4px;
      color: var(--text);
      font-size: 12px;
      padding: 3px 6px;
    }
    .budget-input:focus { outline: none; border-color: var(--accent); }

    .budget-hint {
      font-size: 10px;
      color: var(--text-3);
      margin-left: 4px;
    }

    .budget-actions {
      display: flex;
      gap: 6px;
      margin-top: 2px;
    }

    .budget-save {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--accent);
      cursor: pointer;
    }
    .budget-save:hover { background: var(--accent); color: var(--surface); }

    .budget-cancel {
      font-size: 11px;
      background: none;
      border: none;
      color: var(--text-3);
      cursor: pointer;
      padding: 0 2px;
    }
    .budget-cancel:hover { color: var(--text); }

    footer {
      padding: 12px 16px;
      text-align: center;
    }

    footer a {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--text-4);
      text-decoration: none;
      padding: 6px 14px;
      border: 1px solid var(--btn-border);
      border-radius: 5px;
      transition: background 0.1s, border-color 0.1s, color 0.1s;
    }
    footer a:hover { background: var(--raised); border-color: var(--accent); color: var(--accent); }

    #health-banner {
      display: none;
      margin: 0 0 10px;
      padding: 8px 10px;
      border: 1px solid #e0a000;
      border-radius: 6px;
      background: rgba(224, 160, 0, 0.08);
      color: var(--text);
      font-size: 11.5px;
      line-height: 1.45;
    }
    #health-banner.visible { display: block; }
    #health-banner strong { color: #b98400; }
  </style>
</head>
<body>
  <header>
    <h1>
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none" style="vertical-align:-2px;margin-right:6px;color:var(--accent)">
        <rect x="2" y="1" width="10" height="13" rx="1.75" stroke="currentColor" stroke-width="1.35"/>
        <path d="M4.5 5h6M4.5 7.75h6M4.5 10.5h3.5" stroke="currentColor" stroke-width="1.15" stroke-linecap="round"/>
      </svg>PromptLedger</h1>
    <button id="pause-btn">Pause</button>
  </header>

  <div id="health-banner" role="alert"></div>

  <div class="stats">
    <div class="stat">
      <span class="label">Today</span>
      <span class="value" id="credits-today">—</span>
    </div>
    <div class="stat">
      <span class="label">This week</span>
      <span class="value" id="credits-week">—</span>
    </div>
    <div class="stat">
      <span class="label">This month</span>
      <span class="value" id="cost-month">—</span>
    </div>
  </div>

  <div id="by-tool"></div>

  <section id="projects">
    <div class="section-label">Active project</div>
    <div class="project-row">
      <select id="project-select">
        <option value="">None — don't tag</option>
      </select>
      <button id="new-proj-btn" title="New project">+</button>
    </div>
    <div class="project-form" id="project-form">
      <input class="proj-input" id="proj-input" type="text" placeholder="Project name" maxlength="40" />
      <button class="proj-save" id="proj-save">Add</button>
      <button class="proj-cancel" id="proj-cancel">✕</button>
    </div>
  </section>

  <section id="plans">
    <div class="section-label">Plans</div>
    <!-- Populated by popup.ts -->
  </section>

  <section id="budgets">
    <div class="section-label">Budget alerts</div>
    <!-- Populated by popup.ts -->
  </section>

  <footer>
    <a id="dashboard-link" href="#">
      Open full dashboard
      <svg width="9" height="9" viewBox="0 0 9 9" fill="none">
        <path d="M1.5 4.5h6M5 2l2.5 2.5L5 7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
