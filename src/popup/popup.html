<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PromptLedger</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: #0f0f11;
      color: #e2e2e8;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 12px;
      border-bottom: 1px solid #1e1e24;
    }

    h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #fff;
    }

    #pause-btn {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 4px;
      border: 1px solid #2e2e38;
      background: transparent;
      color: #9898a8;
      cursor: pointer;
    }
    #pause-btn:hover { background: #1e1e24; color: #e2e2e8; }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1px;
      background: #1e1e24;
      border-bottom: 1px solid #1e1e24;
    }

    .stat {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 14px 12px;
      background: #0f0f11;
    }

    .stat .label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #6868788;
      color: #686878;
    }

    .stat .value {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      font-variant-numeric: tabular-nums;
    }

    #by-tool {
      padding: 12px 16px;
    }

    .tool-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid #1a1a20;
      color: #b0b0c0;
    }
    .tool-row:last-child { border-bottom: none; }
    .tool-row .tool-name { text-transform: capitalize; }
    .tool-row .tool-cost { font-variant-numeric: tabular-nums; color: #e2e2e8; }

    .empty-state {
      padding: 24px 16px;
      text-align: center;
      color: #686878;
      font-size: 12px;
      line-height: 1.6;
    }

    footer {
      padding: 12px 16px;
      border-top: 1px solid #1e1e24;
      text-align: center;
    }

    footer a {
      font-size: 12px;
      color: #7c7cff;
      text-decoration: none;
    }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <h1>PromptLedger</h1>
    <button id="pause-btn">Pause</button>
  </header>

  <div class="stats">
    <div class="stat">
      <span class="label">Today</span>
      <span class="value" id="credits-today">—</span>
    </div>
    <div class="stat">
      <span class="label">This week</span>
      <span class="value" id="credits-week">—</span>
    </div>
    <div class="stat">
      <span class="label">This month</span>
      <span class="value" id="cost-month">—</span>
    </div>
  </div>

  <div id="by-tool"></div>

  <footer>
    <a id="dashboard-link" href="#">Open full dashboard</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
