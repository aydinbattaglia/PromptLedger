<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PromptLedger</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: #0f0f11;
      color: #e2e2e8;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 12px;
      border-bottom: 1px solid #1e1e24;
    }

    h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #fff;
    }

    #pause-btn {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 4px;
      border: 1px solid #2e2e38;
      background: transparent;
      color: #9898a8;
      cursor: pointer;
    }
    #pause-btn:hover { background: #1e1e24; color: #e2e2e8; }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1px;
      background: #1e1e24;
      border-bottom: 1px solid #1e1e24;
    }

    .stat {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 14px 12px;
      background: #0f0f11;
    }

    .stat .label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #686878;
    }

    .stat .value {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      font-variant-numeric: tabular-nums;
    }

    #by-tool {
      padding: 12px 16px;
      border-bottom: 1px solid #1e1e24;
    }

    .tool-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid #1a1a20;
      color: #b0b0c0;
    }
    .tool-row:last-child { border-bottom: none; }
    .tool-name { text-transform: capitalize; }
    .tool-cost { font-variant-numeric: tabular-nums; color: #e2e2e8; }

    .empty-state {
      padding: 20px 16px;
      text-align: center;
      color: #686878;
      font-size: 12px;
      line-height: 1.6;
    }

    /* ── Projects section ── */
    #projects {
      padding: 10px 16px 14px;
      border-bottom: 1px solid #1e1e24;
    }

    .project-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    #project-select {
      flex: 1;
      background: #1e1e24;
      border: 1px solid #2e2e38;
      border-radius: 4px;
      color: #e2e2e8;
      font-size: 12px;
      padding: 4px 8px;
      outline: none;
    }
    #project-select:focus { border-color: #7c7cff; }

    #new-proj-btn {
      font-size: 15px;
      line-height: 1;
      width: 24px;
      height: 24px;
      border-radius: 4px;
      border: 1px solid #2e2e38;
      background: transparent;
      color: #9898a8;
      cursor: pointer;
    }
    #new-proj-btn:hover { background: #1e1e24; color: #e2e2e8; }

    .project-form {
      display: none;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
    }
    .project-form.visible { display: flex; }

    .proj-input {
      flex: 1;
      background: #1e1e24;
      border: 1px solid #2e2e38;
      border-radius: 4px;
      color: #e2e2e8;
      font-size: 12px;
      padding: 4px 8px;
      outline: none;
    }
    .proj-input:focus { border-color: #7c7cff; }

    .proj-save {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid #7c7cff;
      background: transparent;
      color: #7c7cff;
      cursor: pointer;
    }
    .proj-save:hover { background: #7c7cff; color: #fff; }

    .proj-cancel {
      font-size: 11px;
      background: none;
      border: none;
      color: #686878;
      cursor: pointer;
      padding: 0 2px;
    }
    .proj-cancel:hover { color: #e2e2e8; }

    /* ── Plans section ── */
    #plans {
      padding: 10px 16px 14px;
      border-bottom: 1px solid #1e1e24;
    }

    .section-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #686878;
      margin-bottom: 8px;
    }

    .plan-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 0;
      border-bottom: 1px solid #1a1a20;
    }
    .plan-row:last-child { border-bottom: none; }

    .plan-tool {
      text-transform: capitalize;
      color: #b0b0c0;
      width: 76px;
      flex-shrink: 0;
    }

    .plan-status {
      flex: 1;
      color: #e2e2e8;
      font-variant-numeric: tabular-nums;
    }
    .plan-status.unset { color: #686878; font-style: italic; }

    .plan-action {
      font-size: 11px;
      color: #7c7cff;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      text-decoration: none;
      white-space: nowrap;
    }
    .plan-action:hover { text-decoration: underline; }

    /* Inline override form */
    .plan-form {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 5px 0;
      border-bottom: 1px solid #1a1a20;
    }
    .plan-form:last-child { border-bottom: none; }
    .plan-form.visible { display: flex; }

    .plan-form .plan-tool { width: 76px; flex-shrink: 0; }

    .plan-input {
      width: 72px;
      background: #1e1e24;
      border: 1px solid #2e2e38;
      border-radius: 4px;
      color: #e2e2e8;
      font-size: 12px;
      padding: 3px 6px;
    }
    .plan-input:focus { outline: none; border-color: #7c7cff; }

    .plan-unit { font-size: 11px; color: #686878; }

    .plan-save {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid #7c7cff;
      background: transparent;
      color: #7c7cff;
      cursor: pointer;
    }
    .plan-save:hover { background: #7c7cff; color: #fff; }

    .plan-cancel {
      font-size: 11px;
      background: none;
      border: none;
      color: #686878;
      cursor: pointer;
      padding: 0 2px;
    }
    .plan-cancel:hover { color: #e2e2e8; }

    footer {
      padding: 12px 16px;
      text-align: center;
    }

    footer a {
      font-size: 12px;
      color: #7c7cff;
      text-decoration: none;
    }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <h1>PromptLedger</h1>
    <button id="pause-btn">Pause</button>
  </header>

  <div class="stats">
    <div class="stat">
      <span class="label">Today</span>
      <span class="value" id="credits-today">—</span>
    </div>
    <div class="stat">
      <span class="label">This week</span>
      <span class="value" id="credits-week">—</span>
    </div>
    <div class="stat">
      <span class="label">This month</span>
      <span class="value" id="cost-month">—</span>
    </div>
  </div>

  <div id="by-tool"></div>

  <section id="projects">
    <div class="section-label">Active project</div>
    <div class="project-row">
      <select id="project-select">
        <option value="">None — don't tag</option>
      </select>
      <button id="new-proj-btn" title="New project">+</button>
    </div>
    <div class="project-form" id="project-form">
      <input class="proj-input" id="proj-input" type="text" placeholder="Project name" maxlength="40" />
      <button class="proj-save" id="proj-save">Add</button>
      <button class="proj-cancel" id="proj-cancel">✕</button>
    </div>
  </section>

  <section id="plans">
    <div class="section-label">Plans</div>
    <!-- Populated by popup.ts -->
  </section>

  <footer>
    <a id="dashboard-link" href="#">Open full dashboard</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
